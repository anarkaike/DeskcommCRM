name: Fork release safety

on:
  push:
    branches: [main]
    paths: ["scripts/fork/**", ".github/workflows/fork-release-check.yml"]
  pull_request:
    paths: ["scripts/fork/**", ".github/workflows/fork-release-check.yml"]

permissions:
  contents: read

jobs:
  release-safety:
    if: github.repository != 'melgarafael/DeskcommCRM'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify immutable fork release export guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/fork -p 'test_*.py' -v
